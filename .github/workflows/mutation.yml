name: Mutation Testing

# AGENTIC-TESTING-PLAN.md Phase 5 / issue #154. Deliberately its own workflow,
# not a step in tests.yml: a full Stryker run is much slower than the rest of
# the gate and must not block the fast per-PR feedback loop. Neither job here
# is a required status check (docs/BRANCH-PROTECTION.md) — mutation testing is
# a signal for humans and agents to act on, not a merge gate yet.

on:
  pull_request:
  schedule:
    # Monday 06:00 UTC. Full run only; PRs use incremental mode instead.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # Fast path: only the mutants touching lines changed in the PR, using the
  # incremental cache from the most recent run on this branch (or its base).
  incremental:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore incremental mutation cache
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          # No cache is ever hit at this exact key (run_id is unique per run);
          # restore-keys falls back to the most recent prior entry, and the
          # post-job step then saves this run's result under the new key so
          # the next PR run has something fresher to restore.
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-
      - name: Run mutation testing (incremental)
        run: pnpm exec stryker run --incremental

  # Slow path: every mutant, on a schedule, with the HTML report published so
  # a human can drill into survivors without re-running Stryker locally.
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run mutation testing (full)
        run: pnpm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 90
