# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Tests

on:
  push:
    branches: [ "main" ]
  # Deliberately unfiltered by base branch. A `branches: [ "main" ]` filter here
  # means a stacked PR — one targeting another feature branch rather than main —
  # gets no test run at all, and reads as green because only third-party checks
  # report. That happened on PR #159. Every PR runs the suite.
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    # Gate order: install -> type-check -> lint -> acceptance -> tests + coverage -> build
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm run check
    # Runs at --max-warnings 0. Pre-existing findings are recorded in
    # eslint-suppressions.json; a NEW violation is not suppressed and fails here.
    - name: Lint
      run: pnpm run lint
    # The acceptance stream (tests/acceptance), run on its own so the two test
    # streams are independently visible in CI output — a red line here means the
    # human-approved behavioural contract in specs/ was broken, which is a
    # different failure from a unit test breaking. It is a SUBSET of the next
    # step, not extra coverage; the duplication buys the separate signal.
    - name: Run acceptance tests
      run: pnpm run test:acceptance
    - name: Run tests with coverage
      run: pnpm run test:run --coverage
    - name: Build
      run: pnpm run build
